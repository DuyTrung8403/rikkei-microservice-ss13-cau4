server:
  port: 8888

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity-service-route
              uri: http://localhost:8080
              predicates:
                - Path=/identity/**
              filters:
                - StripPrefix=1
      routes:
        - id: identity-service-route-legacy
          uri: http://localhost:8080
          predicates:
            - Path=/identity/**
          filters:
            - StripPrefix=1
